# Har bir PR va deploy oldidan: lint, TypeScript, unit testlar, PostgreSQL/Redis integratsiya testlari,
# Cloudflare Worker ning haqiqiy runtime (workerd) dagi E2E testi.
name: Tekshiruv

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, testlar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mafia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/mafia_test
      REDIS_URL: redis://127.0.0.1:6379
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production dependency audit (high/critical blocks CI)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript (Node server + Cloudflare worker)
        run: npm run typecheck

      - name: Unit testlar (GameEngine, 30 rol, simulyatsiya, Cloudflare mantiqi)
        run: npm test

      - name: Integratsiya testlari (PostgreSQL, Redis)
        run: npm run test:integration

      - name: Isolated staging Worker bundle (no deploy)
        working-directory: apps/cloudflare
        run: npx wrangler deploy --config wrangler.staging.toml --dry-run --outdir "$RUNNER_TEMP/v2-staging-bundle"

      - name: Cloudflare E2E (workerd + Durable Objects + soxta Telegram)
        run: npm run cf:e2e

  # No automatic PR/push deployments. This job only runs on a deliberate manual
  # dispatch of the existing Tekshiruv workflow on the V2 branch, after green CI.
  deploy_staging:
    name: Explicit isolated V2 Telegram preview
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hypernova-role-parity-v16'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hypernova-v2-staging
    concurrency:
      group: hypernova-v2-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BOT_TOKEN: ${{ secrets.STAGING_BOT_TOKEN }}
      STAGING_BOT_ID: ${{ vars.STAGING_BOT_ID }}
      PRODUCTION_BOT_ID: ${{ vars.PRODUCTION_BOT_ID }}
      STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
      STAGING_ADMIN_IDS: ${{ vars.STAGING_ADMIN_IDS }}
      STAGING_CONFIRM: ${{ vars.STAGING_CONFIRM }}
      STAGING_V2_LEDGER: ${{ vars.STAGING_V2_LEDGER }}
      STAGING_EXPECTED_USERNAME: HypernovaV2Test_Bot
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read-only staging preflight
        run: node apps/cloudflare/scripts/staging-launch.mjs
      - name: Deploy only isolated preview and verify webhook
        run: node apps/cloudflare/scripts/staging-launch.mjs --apply
