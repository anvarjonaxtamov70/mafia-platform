# main ga har bir o'zgarish: tekshiruv → Cloudflare Worker (bepul) → Telegram webhook.
# Sozlamalar: GitHub → Settings → Secrets and variables → Actions (docs/04-CLOUDFLARE.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloudflare + Telegram
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ vars.ADMIN_IDS }}
      DEV_FAKE_PLAYERS: ${{ vars.DEV_FAKE_PLAYERS }}
      STARS_MODE: ${{ vars.STARS_MODE }}
      VISUAL_MEDIA: ${{ vars.VISUAL_MEDIA }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Sozlamalarni tekshirish
        id: config
        run: node scripts/check-config.mjs

      - if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: 1/2 Cloudflare Worker (bot + o'yin xonalari)
        id: worker
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/cloudflare
        run: |
          args=()
          for k in ADMIN_IDS DEV_FAKE_PLAYERS STARS_MODE VISUAL_MEDIA; do
            v="${!k}"
            if [ -n "$v" ]; then args+=(--var "$k:$v"); fi
          done

          # Yangi Worker birinchi marta yaratilganda Cloudflare API uni bir necha soniya
          # "topilmadi" (code 10007) deb qaytarishi mumkin — shunda qayta urinamiz.
          ok=0
          for attempt in 1 2 3 4 5; do
            set +e
            npx wrangler deploy "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" = "0" ]; then ok=1; break; fi
            if grep -qE "10007|does not exist on your account" "$RUNNER_TEMP/deploy.log"; then
              echo "::notice::Cloudflare yangi Worker'ni hali ro'yxatga olmagan ($attempt/5) — 20 soniyadan keyin qayta urinish..."
              sleep 20
              continue
            fi
            break
          done
          if [ "$ok" != "1" ]; then
            echo "::error::wrangler deploy muvaffaqiyatsiz. Yuqoridagi xabarni o'qing (docs/04-CLOUDFLARE.md → Muammo bo'lsa)."
            exit 1
          fi

          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          if [ -z "$url" ]; then
            echo "::error::Worker manzili topilmadi. Cloudflare → Workers & Pages sahifasini bir marta ochib, workers.dev subdomenini tanlang (docs/04-CLOUDFLARE.md)."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

          # Bot tokeni Worker'ga shifrlangan holda yoziladi (kodda va jurnalda ko'rinmaydi)
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify({ BOT_TOKEN: process.env.BOT_TOKEN.trim() }))'
          saved=0
          for attempt in 1 2 3; do
            if npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"; then saved=1; break; fi
            echo "Sirni yozib bo'lmadi ($attempt/3), 15 soniyadan keyin qayta..."
            sleep 15
          done
          rm -f "$RUNNER_TEMP/secrets.json"
          if [ "$saved" != "1" ]; then
            echo "::error::BOT_TOKEN ni Worker'ga yozib bo'lmadi."
            exit 1
          fi

      - name: 2/2 Telegram (webhook, buyruqlar, tavsif)
        id: bot
        if: steps.config.outputs.ready == 'true'
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          key=$(printf '%s' "mafia-setup|$(printf '%s' "$BOT_TOKEN" | tr -d '[:space:]')" | sha256sum | cut -d' ' -f1)
          for i in $(seq 1 12); do
            code=$(curl -sS -o "$RUNNER_TEMP/setup.json" -w '%{http_code}' -X POST "$WORKER_URL/telegram/setup" -H "X-Setup-Key: $key" || echo 000)
            if [ "$code" = "200" ]; then break; fi
            echo "Worker hali tayyor emas ($code), 5 soniyadan keyin qayta..."
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "::error::Botni sozlab bo'lmadi ($code): $(cat "$RUNNER_TEMP/setup.json" 2>/dev/null)"
            echo "Ko'pincha sabab: BOT_TOKEN noto'g'ri."
            exit 1
          fi
          username=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/setup.json", "utf8")).username)')
          echo "username=$username" >> "$GITHUB_OUTPUT"

      - name: Tekshiruv (Registry, GameRoom, webhook)
        if: steps.config.outputs.ready == 'true'
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          key=$(printf '%s' "mafia-setup|$(printf '%s' "$BOT_TOKEN" | tr -d '[:space:]')" | sha256sum | cut -d' ' -f1)
          code=$(curl -sS -o "$RUNNER_TEMP/diag.json" -w '%{http_code}' -X POST "$WORKER_URL/telegram/diag" -H "X-Setup-Key: $key" || echo 000)
          node -e '
            const d = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/diag.json", "utf8"));
            const row = (name, v) => console.log(`${v && v.ok ? "✅" : "❌"} ${name.padEnd(10)} ${JSON.stringify(v)}`);
            row("Registry", d.registry); row("GameRoom", d.room); row("Webhook", d.webhook);
            if (!d.ok) { console.log("::error::Tekshiruvda xato bor (yuqoridagi ❌ qatorlar)"); process.exit(1); }
          ' || { echo "HTTP $code: $(cat "$RUNNER_TEMP/diag.json" 2>/dev/null)"; exit 1; }

      - name: Natija
        if: steps.config.outputs.ready == 'true'
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          BOT_USERNAME: ${{ steps.bot.outputs.username }}
        run: |
          {
            echo "## ✅ Mafia bot ishga tushdi"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Telegram bot | https://t.me/$BOT_USERNAME |"
            echo "| Worker | $WORKER_URL |"
            echo ""
            echo "Botni guruhga qo'shing, administrator qiling va **/game** yozing."
          } >> "$GITHUB_STEP_SUMMARY"
