# Lokal ishga tushirish:
#   docker compose up -d postgres redis    # faqat baza va Redis (npm run dev bilan)
#   docker compose up -d --build           # hammasi, bot ham konteynerda (server uchun ham shu)
#
# Production: .env da POSTGRES_PASSWORD ni kuchli parolga almashtiring.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mafia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mafia}
      POSTGRES_DB: mafia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafia"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mafia:${POSTGRES_PASSWORD:-mafia}@postgres:5432/mafia
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
