# Mafia bot — Cloudflare Worker (bepul tarif): Telegram webhook + Durable Objects
name = "mafia-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Har bir guruh — alohida GameRoom (lobby, o'yin, taymerlar); Registry — umumiy ma'lumotlar
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

# Bepul tarifda faqat SQLite asosidagi Durable Objects ishlaydi
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Registry"]

# Monorepo paketlari to'g'ridan-to'g'ri manba koddan bundlanadi
[alias]
"@mafia/game-engine" = "../../packages/game-engine/src/index.ts"
"@mafia/localization" = "../../packages/localization/src/index.ts"
"@mafia/bot-core" = "../../packages/bot-core/src/index.ts"

[observability]
enabled = true

# Standart qiymatlar. GitHub Actions → Variables da shu nomli o'zgaruvchi berilsa, o'sha ustun turadi.
#   ADMIN_IDS        — bot egalari (/admin_minplayers, /admin_stats). Telegram ID maxfiy emas.
#   DEV_FAKE_PLAYERS — true: guruhda /devfill N (bot-o'yinchilar, mashq o'yini, statistikaga yozilmaydi)
[vars]
ADMIN_IDS = "5105291033,7184608742"
DEV_FAKE_PLAYERS = "true"

# Sir (GitHub Actions orqali shifrlangan holda yoziladi): BOT_TOKEN
